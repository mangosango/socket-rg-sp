# Slot uses the Game Boy model and automatic GBC palettes for GB games.
mgba_color_correction = "GBC"
mgba_gb_model = "Game Boy"
mgba_gb_colors_preset = "0"
mgba_gb_colors = "Auto"
mgba_sgb_borders = "OFF"
# Slot draws each normal-speed frame; RetroArch's audio-driven auto mode differs.
mgba_frameskip = "disabled"
mgba_interframe_blending = "OFF"
