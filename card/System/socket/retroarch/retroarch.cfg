# RetroArch settings for Socket on BaseOS. Put the retroarch binary next to this file.
video_driver = "gl"
video_context_driver = "fbdev_mali"
# Keep presentation synchronized without a queued video frame.
video_threaded = "false"
audio_driver = "alsa"
audio_volume = "-20.0"
input_driver = "udev"
input_joypad_driver = "udev"
menu_driver = "rgui"
# Keep udev active on gamepad-only systems without a keyboard or mouse.
rgui_show_start_screen = "false"
# Hide routine launch messages. Keep errors and save-failure warnings visible.
# Do not show the content and core name banner at launch.
menu_show_load_content_animation = "false"
notification_show_autoconfig = "false"
notification_show_autoconfig_fails = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_cheats_applied = "false"
notification_show_patch_applied = "false"
notification_show_set_initial_disk = "false"
notification_show_save_state = "false"
notification_show_refresh_rate = "false"
notification_show_fast_forward = "false"
video_fullscreen = "true"
libretro_directory = "/mnt/sdcard/System/socket/cores"
system_directory = "/mnt/sdcard/BIOS"
savefile_directory = "/mnt/sdcard/Saves/retroarch"
savestate_directory = "/mnt/sdcard/Saves/retroarch"
screenshot_directory = "/mnt/sdcard/Screenshots"
config_save_on_exit = "false"
# Match the saved Slot playback settings. MENU hold writes the resume state.
fastforward_ratio = "4.0"
audio_fastforward_mute = "false"
savestate_auto_load = "true"
savestate_auto_save = "false"
# Limit lost in-game save data if power or the emulator fails.
autosave_interval = "10"
video_smooth = "false"
aspect_ratio_index = "22"

# H700 gamepad. The udev driver numbers buttons by key code: 0x130=0 (A),
# 0x131=1 (B), 0x132=2 (Y), 0x133=3 (X), 0x134=4 (L1), 0x135=5 (R1),
# 0x136=6 (SELECT), 0x137=7 (START), 0x138=8 (MENU), 0x13a=9 (L2), 0x13b=10 (R2).
# Codes are from slot; check the numbers on your device with RetroArch's input menu.
input_player1_joypad_index = "0"
input_player1_analog_dpad_mode = "1"
input_player1_a_btn = "0"
input_player1_b_btn = "1"
input_player1_y_btn = "2"
input_player1_x_btn = "3"
input_player1_l_btn = "4"
input_player1_r_btn = "5"
input_player1_select_btn = "6"
input_player1_start_btn = "7"
input_player1_l2_btn = "nul"
input_player1_r2_btn = "nul"
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"
# L2 and R2 control playback. Tap MENU for the menu; hold 1 s to save and exit.
input_enable_hotkey_btn = "nul"
input_menu_toggle_btn = "8"
input_exit_emulator_btn = "nul"
input_hold_fast_forward_btn = "10"
input_rewind_btn = "9"
# The session helper owns volume and brightness controls.
input_volume_up_btn = "nul"
input_volume_down_btn = "nul"
rewind_enable = "true"
# Match Slot's snapshot interval instead of saving every frame.
rewind_granularity = "2"
