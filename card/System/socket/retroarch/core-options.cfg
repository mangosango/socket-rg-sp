# Saved Slot settings for mGBA and gpSP. Missing blending settings default to off.
mgba_color_correction = "Auto"
mgba_gb_model = "Autodetect"
mgba_gb_colors_preset = "1"
mgba_gb_colors = "GBC Dark Green →A"
mgba_sgb_borders = "OFF"
# Skip a draw only when the audio buffer is below 25 %. This stops audio
# stutter on slow frames. Slot also sets "auto"; it skips only in fast-forward.
mgba_frameskip = "auto"
mgba_interframe_blending = "OFF"
gpsp_color_correction = "enabled"
gpsp_frame_mixing = "disabled"
gpsp_frameskip = "auto"
gpsp_rtc_time_source = "system"
gpsp_serial = "auto"
