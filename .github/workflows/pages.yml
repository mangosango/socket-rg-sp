name: Converter Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Native arm64 Docker builds the handheld binaries against the pinned target distro.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.2'
      - name: Check out pinned Emscripten SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: emscripten-core/emsdk
          ref: d49219d03a41cd12f95a33ba84273c20d41fd350 # 4.0.11
          path: .emsdk
          persist-credentials: false
      - name: Build public card runtime and corresponding source
        timeout-minutes: 180
        run: |
          python3 tests/test_first_boot.py
          python3 tests/test_card_runtime.py
          python3 tools/build-card-runtime.py work/web-card-runtime.zip
      - name: Build the self-hosted converter
        run: |
          npm ci --ignore-scripts --prefix web
          .emsdk/emsdk install 4.0.11
          .emsdk/emsdk activate 4.0.11
          source .emsdk/emsdk_env.sh
          python3 tools/build-web.py "$RUNNER_TEMP/site"
      - name: Check conversion code
        run: |
          python3 tests/test_build_pack.py
          python3 tests/test_patch_socket.py
          python3 tests/test_web_convert.py
      - name: Exercise the self-hosted worker under the project URL prefix
        run: |
          npm ci --prefix tests/web --ignore-scripts
          (cd tests/web && npx --no-install playwright install --with-deps chromium firefox webkit)
          node --test tests/web/ui.test.cjs
          node tests/web/unpack.mjs "$RUNNER_TEMP/site"
          for browser in chromium firefox webkit; do
            echo "Smoke test: $browser"
            BROWSER="$browser" node tests/web/smoke.mjs "$RUNNER_TEMP/site"
          done
      - name: Verify final Pages contents and corresponding source
        run: python3 tests/check_web_site.py --require-source "$RUNNER_TEMP/site"
      - name: Upload only the verified site on trusted pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
